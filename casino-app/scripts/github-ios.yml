name: Native iOS checks

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      online_tests:
        description: 'Run all four games against the configured Cloudflare backend (creates free-credit guest activity)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      ONLINE_TESTS: ${{ inputs.online_tests && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile native simulator app with local signing
        run: |
          set -o pipefail
          mkdir -p ios/build
          xcodebuild -project ios/AccessHubCasino.xcodeproj -scheme AccessHubCasino \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build 2>&1 | tee ios/build/compile.log
      - name: Select small and large installed iPhones
        run: |
          xcrun simctl list devices available -j | python3 ios/scripts/select_simulators.py >> "$GITHUB_ENV"
      - name: Test smaller iPhone
        id: small
        env:
          TEST_RUNNER_ACCESSHUB_TEST_USERNAME: ${{ secrets.ACCESSHUB_TEST_USERNAME_SMALL }}
          TEST_RUNNER_ACCESSHUB_TEST_PASSWORD: ${{ secrets.ACCESSHUB_TEST_PASSWORD_SMALL }}
        run: |
          set -o pipefail
          echo "Testing $SMALL_NAME"
          xcodebuild -project ios/AccessHubCasino.xcodeproj -scheme AccessHubCasino \
            -destination "platform=iOS Simulator,id=$SMALL_ID" \
            -resultBundlePath ios/build/Small-iPhone.xcresult \
            ACCESSHUB_RUN_ONLINE_TESTS="$ONLINE_TESTS" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            test 2>&1 | tee ios/build/small-iphone.log
      - name: Test larger iPhone
        if: ${{ always() && env.LARGE_ID != '' }}
        env:
          TEST_RUNNER_ACCESSHUB_TEST_USERNAME: ${{ secrets.ACCESSHUB_TEST_USERNAME_LARGE }}
          TEST_RUNNER_ACCESSHUB_TEST_PASSWORD: ${{ secrets.ACCESSHUB_TEST_PASSWORD_LARGE }}
        run: |
          set -o pipefail
          echo "Testing $LARGE_NAME"
          xcodebuild -project ios/AccessHubCasino.xcodeproj -scheme AccessHubCasino \
            -destination "platform=iOS Simulator,id=$LARGE_ID" \
            -resultBundlePath ios/build/Large-iPhone.xcresult \
            ACCESSHUB_RUN_ONLINE_TESTS="$ONLINE_TESTS" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            test 2>&1 | tee ios/build/large-iphone.log
      - name: Export test summaries and screenshots
        if: always()
        run: |
          mkdir -p ios/build/attachments ios/build/summaries
          for RESULT in ios/build/*.xcresult; do
            [ -d "$RESULT" ] || continue
            NAME=$(basename "$RESULT" .xcresult)
            xcrun xcresulttool get test-results summary --path "$RESULT" \
              > "ios/build/summaries/$NAME.json" || true
            xcrun xcresulttool export attachments --path "$RESULT" \
              --output-path "ios/build/attachments/$NAME" || true
          done
      - name: Sanitize test evidence
        id: sanitize
        if: always()
        env:
          ACCESSHUB_TEST_USERNAME_SMALL: ${{ secrets.ACCESSHUB_TEST_USERNAME_SMALL }}
          ACCESSHUB_TEST_PASSWORD_SMALL: ${{ secrets.ACCESSHUB_TEST_PASSWORD_SMALL }}
          ACCESSHUB_TEST_USERNAME_LARGE: ${{ secrets.ACCESSHUB_TEST_USERNAME_LARGE }}
          ACCESSHUB_TEST_PASSWORD_LARGE: ${{ secrets.ACCESSHUB_TEST_PASSWORD_LARGE }}
        run: python3 ios/scripts/sanitize-test-evidence.py ios/build
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        with:
          name: Native-iOS-test-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            ios/build/*.log
            ios/build/summaries/*.json
            ios/build/attachments/**/*.png
            ios/build/attachments/**/manifest.json
