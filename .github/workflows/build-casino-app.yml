name: Build AccessHub support IPA
on:
  workflow_dispatch:
  push:
    paths: ['casino-app/**', '.github/workflows/build-casino-app.yml']
permissions:
  contents: read
jobs:
  unsigned-device-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned arm64 iPhone IPA
        run: bash casino-app/scripts/build-loader-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AccessHub-Support-Web-IPA
          if-no-files-found: error
          retention-days: 14
          path: |
            casino-app/build/loader/output/AccessHubCasino.ipa
            casino-app/build/loader/output/AccessHubCasino.ipa.sha256
            casino-app/build/loader/output/AccessHubCasino-build.json
      - name: Select iPhone simulator
        run: xcrun simctl list devices available -j | python3 casino-app/scripts/select_simulators.py >> "$GITHUB_ENV"
      - name: Test native login and hosted support on iPhone
        run: |
          set -o pipefail
          xcodebuild -project casino-app/AccessHubCasino.xcodeproj -scheme AccessHubCasino \
            -destination "platform=iOS Simulator,id=$SMALL_ID" \
            -derivedDataPath casino-app/build/simulator -resultBundlePath casino-app/build/Support.xcresult \
            -only-testing:AccessHubCasinoUITests/AccessHubCasinoUITests/testWelcomeAndSignIn \
            -only-testing:AccessHubCasinoUITests/AccessHubCasinoUITests/testSupportWebsiteLoadsAndOpensSignIn \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee casino-app/build/support-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Support-UI-test-evidence
          path: |
            casino-app/build/support-test.log
            casino-app/build/Support.xcresult
